<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spray Foam Estimator AI</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#ff6b2b;--orange-dark:#e55a1e;
  --slate-900:#0f172a;--slate-800:#1e293b;--slate-700:#334155;
  --slate-600:#475569;--slate-500:#64748b;--slate-400:#94a3b8;
  --slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--slate-100);color:var(--slate-900);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}

/* NAV */
.topnav{background:var(--slate-900);padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.nav-logo{display:flex;align-items:center;gap:9px;color:#fff;font-size:15px;font-weight:700}
.nav-logo-mark{width:30px;height:30px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.nav-hint{font-size:11px;color:var(--slate-500)}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:#fff;border-right:1px solid var(--slate-200);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:24px 28px}

/* SIDEBAR SECTIONS */
.sb-section{padding:16px}
.sb-section+.sb-section{border-top:1px solid var(--slate-100)}
.sb-label{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

/* UPLOAD ZONE */
.drop-zone{border:2px dashed var(--slate-300);border-radius:10px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;background:var(--slate-50)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--orange);background:rgba(255,107,43,.04)}
.drop-icon{font-size:28px;margin-bottom:8px}
.drop-title{font-size:13px;font-weight:600;color:var(--slate-700);margin-bottom:3px}
.drop-sub{font-size:11px;color:var(--slate-400);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-dark)}
.btn-outline{background:#fff;color:var(--slate-700);border:1px solid var(--slate-300)}.btn-outline:hover{background:var(--slate-50)}
.btn-sm{padding:5px 12px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-full{width:100%;justify-content:center;padding:9px}

/* FILE LIST */
.file-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:1px solid var(--slate-200);margin-top:8px;background:#fff;font-size:12px}
.file-item.ready{border-color:#86efac;background:#f0fdf4}
.file-name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{color:var(--slate-400);flex-shrink:0}
.file-remove{color:var(--slate-300);border:none;background:none;cursor:pointer;font-size:14px;padding:0;line-height:1;flex-shrink:0}
.file-remove:hover{color:#ef4444}

/* SUMMARY STATS */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px}
.stat-label{color:var(--slate-500)}
.stat-val{font-weight:700}
.stat-divider{border:none;border-top:1px solid var(--slate-100);margin:6px 0}
.sell-box{background:var(--orange);border-radius:9px;padding:12px;text-align:center;margin-top:10px}
.sell-label{color:rgba(255,255,255,.8);font-size:10px;margin-bottom:2px}
.sell-price{color:#fff;font-size:24px;font-weight:800}
.sell-sub{color:rgba(255,255,255,.6);font-size:9px;margin-top:2px}

/* WARNINGS */
.warn-item{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:7px 9px;margin-top:6px;line-height:1.4}

/* MAIN AREA */
.page-title{font-size:20px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:12px;color:var(--slate-500);margin-bottom:20px}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--slate-400)}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:.5}
.empty-title{font-size:16px;font-weight:600;color:var(--slate-600);margin-bottom:6px}
.empty-sub{font-size:13px;line-height:1.6;max-width:320px;margin:0 auto}

/* LOADING */
.loading{text-align:center;padding:60px 20px}
.spinner{width:44px;height:44px;border:3px solid var(--slate-200);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-size:15px;font-weight:600;margin-bottom:6px}
.loading-sub{font-size:12px;color:var(--slate-400)}

/* FLOOR SECTION */
.floor-header{font-size:11px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.floor-header::after{content:'';flex:1;border-top:1px solid var(--slate-200)}

/* TABLE */
.tbl-wrap{background:#fff;border:1px solid var(--slate-200);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--slate-50)}
th{padding:9px 11px;text-align:right;font-size:10px;font-weight:700;color:var(--slate-500);border-bottom:1px solid var(--slate-200);white-space:nowrap}
th:first-child,th:nth-child(2){text-align:left}
td{padding:8px 11px;border-bottom:1px solid var(--slate-100);text-align:right;color:var(--slate-800);white-space:nowrap}
td:first-child,td:nth-child(2){text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--slate-50)}
tbody tr.low-conf td{background:#fffbeb}

/* BADGES */
.foam-cc{background:#dbeafe;color:#1e40af;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px}
.foam-oc{background:#ede9fe;color:#5b21b6;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px}
.conf{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px}
.conf-h{background:#dcfce7;color:#15803d}
.conf-m{background:#fef9c3;color:#92400e}
.conf-l{background:#fee2e2;color:#991b1b}
.type-badge{font-size:9px;color:var(--slate-400);background:var(--slate-100);padding:1px 6px;border-radius:4px}

/* PROJ INFO */
.proj-info{background:#fff;border:1px solid var(--slate-200);border-radius:10px;padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.proj-info-name{font-size:16px;font-weight:700}
.proj-info-meta{font-size:11px;color:var(--slate-400);margin-top:2px}
.proj-info-right{margin-left:auto;display:flex;gap:12px}
.proj-stat{text-align:right}
.proj-stat-val{font-size:14px;font-weight:700}
.proj-stat-lab{font-size:10px;color:var(--slate-400)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:3px}
</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-logo">
    <div class="nav-logo-mark">🧊</div>
    Spray Foam Estimator AI
  </div>
  <span class="nav-hint">Powered by Claude claude-sonnet-4-6</span>
</nav>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Upload -->
    <div class="sb-section">
      <div class="sb-label">Upload Plan</div>
      <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.tiff,.tif,.webp" style="display:none" onchange="onFileSelect(this.files)">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="drop-icon">☁️</div>
        <div class="drop-title">Drop your plan here</div>
        <div class="drop-sub">PDF, PNG, JPG, TIFF</div>
        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();document.getElementById('file-input').click()">Browse Files</button>
      </div>
      <div id="file-list"></div>
      <button id="analyze-btn" class="btn btn-primary btn-full" style="margin-top:10px;display:none" onclick="analyze()">
        Analyze with Claude AI →
      </button>
    </div>

    <!-- Summary (shown after analysis) -->
    <div class="sb-section" id="summary-section" style="display:none">
      <div class="sb-label">Summary</div>
      <div id="summary-content"></div>
    </div>

    <!-- Warnings -->
    <div class="sb-section" id="warnings-section" style="display:none">
      <div class="sb-label">⚠️ Flags</div>
      <div id="warnings-content"></div>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="empty">
      <div class="empty-icon">📐</div>
      <div class="empty-title">No plan analyzed yet</div>
      <div class="empty-sub">Upload a PDF or image of your building plans on the left. Claude AI will extract all dimensions and generate a full spray foam estimate.</div>
    </div>
  </main>

</div>

<script>
let selectedFile = null;

// ── DRAG & DROP ──
const zone = document.getElementById('drop-zone');
zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('drag-over');
  onFileSelect(e.dataTransfer.files);
});

function onFileSelect(files) {
  if (!files || !files.length) return;
  selectedFile = files[0];
  const mb = (selectedFile.size / 1048576).toFixed(1);
  const icon = selectedFile.name.endsWith('.pdf') ? '📕' : '🖼️';
  document.getElementById('file-list').innerHTML = `
    <div class="file-item ready">
      <span>${icon}</span>
      <span class="file-name">${selectedFile.name}</span>
      <span class="file-size">${mb} MB</span>
      <button class="file-remove" onclick="clearFile()">✕</button>
    </div>`;
  const btn = document.getElementById('analyze-btn');
  btn.style.display = 'flex';
  btn.textContent = 'Analyze with Claude AI →';
}

function clearFile() {
  selectedFile = null;
  document.getElementById('file-list').innerHTML = '';
  document.getElementById('analyze-btn').style.display = 'none';
  document.getElementById('file-input').value = '';
}

// ── ANALYZE ──
async function analyze() {
  if (!selectedFile) return;

  const btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  btn.textContent = 'Analyzing…';

  document.getElementById('main').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-title">Claude is reading your plan…</div>
      <div class="loading-sub">Extracting dimensions, calculating board feet, estimating costs.<br>This usually takes 15–30 seconds.</div>
    </div>`;

  document.getElementById('summary-section').style.display = 'none';
  document.getElementById('warnings-section').style.display = 'none';

  const form = new FormData();
  form.append('file', selectedFile);

  try {
    const res  = await fetch('/api/analyze', { method: 'POST', body: form });
    const json = await res.json();

    if (!res.ok || !json.success) {
      throw new Error(json.error || 'Analysis failed');
    }

    renderDashboard(json.data);
  } catch (err) {
    document.getElementById('main').innerHTML = `
      <div class="empty">
        <div class="empty-icon">❌</div>
        <div class="empty-title">Analysis failed</div>
        <div class="empty-sub">${err.message}</div>
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyze with Claude AI →';
  }
}

// ── RENDER ──
function fmt(n)  { return n == null ? '—' : Number(n).toLocaleString(); }
function fmtD(n) { return n == null ? '—' : Number(n).toFixed(1); }
function fmtMoney(n) { return n == null ? '—' : '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:0}); }

function confBadge(c) {
  if (c == null) return '';
  const cls = c >= 85 ? 'conf-h' : c >= 65 ? 'conf-m' : 'conf-l';
  return `<span class="conf ${cls}">${c}%</span>`;
}

function foamBadge(t) {
  return t === 'closed_cell'
    ? '<span class="foam-cc">CC</span>'
    : '<span class="foam-oc">OC</span>';
}

function typeLabel(t) {
  const map = {
    exterior_wall:'Ext Wall', interior_wall:'Int Wall', roof:'Roof',
    attic_floor:'Attic Floor', rim_joist:'Rim Joist', crawl_space:'Crawl Space',
    garage_wall:'Garage', foundation_wall:'Foundation'
  };
  return `<span class="type-badge">${map[t] || t}</span>`;
}

function renderDashboard(data) {
  const s = data.summary || {};

  // Sidebar summary
  document.getElementById('summary-section').style.display = 'block';
  document.getElementById('summary-content').innerHTML = `
    <div class="stat-row"><span class="stat-label">Total Net Area</span><span class="stat-val">${fmt(s.total_net_area_sf)} sf</span></div>
    <div class="stat-row"><span class="stat-label">Total Board Feet</span><span class="stat-val">${fmt(s.total_board_feet)} BF</span></div>
    <div class="stat-row"><span class="stat-label">Closed Cell BF</span><span class="stat-val">${fmt(s.closed_cell_bf)}</span></div>
    <div class="stat-row"><span class="stat-label">Open Cell BF</span><span class="stat-val">${fmt(s.open_cell_bf)}</span></div>
    <hr class="stat-divider">
    <div class="stat-row"><span class="stat-label">Material Cost</span><span class="stat-val">${fmtMoney(s.estimated_material_cost)}</span></div>
    <div class="sell-box">
      <div class="sell-label">Estimated Sell Price</div>
      <div class="sell-price">${fmtMoney(s.estimated_sell_price)}</div>
      <div class="sell-sub">Incl. labor + 35% margin</div>
    </div>`;

  // Warnings
  const flags = (s.warning_flags || []).filter(Boolean);
  if (flags.length) {
    document.getElementById('warnings-section').style.display = 'block';
    document.getElementById('warnings-content').innerHTML = flags
      .map(f => `<div class="warn-item">⚠️ ${f}</div>`)
      .join('');
  }

  // Main area — project header + floors
  const floors = data.floors || [];
  let html = '';

  // Project header
  html += `
    <div class="proj-info">
      <div>
        <div class="proj-info-name">${data.project_name || 'Unknown Project'}</div>
        <div class="proj-info-meta">Scale: ${data.scale || 'Not detected'} · ${floors.length} floor${floors.length !== 1 ? 's' : ''} · ${floors.reduce((a,f)=>(a + (f.areas||[]).length),0)} surfaces</div>
      </div>
      <div class="proj-info-right">
        <div class="proj-stat"><div class="proj-stat-val">${fmt(s.total_net_area_sf)} sf</div><div class="proj-stat-lab">Net Area</div></div>
        <div class="proj-stat"><div class="proj-stat-val">${fmt(s.total_board_feet)}</div><div class="proj-stat-lab">Board Feet</div></div>
        <div class="proj-stat"><div class="proj-stat-val" style="color:var(--orange)">${fmtMoney(s.estimated_sell_price)}</div><div class="proj-stat-lab">Sell Price</div></div>
      </div>
    </div>`;

  if (!floors.length) {
    html += `<div class="empty"><div class="empty-icon">🤷</div><div class="empty-title">No measurements extracted</div><div class="empty-sub">Claude couldn't find clear dimensions in this plan. Try a higher-resolution image or a cleaner PDF.</div></div>`;
  } else {
    floors.forEach(floor => {
      const areas = floor.areas || [];
      html += `<div class="floor-header">${floor.name || 'Floor'} <span style="color:var(--slate-500);font-weight:400;font-size:10px">${areas.length} surface${areas.length !== 1 ? 's' : ''}</span></div>`;
      html += `<div class="tbl-wrap"><table>
        <thead><tr>
          <th>Surface</th><th>Type</th>
          <th>L (ft)</th><th>H (ft)</th>
          <th>Windows sf</th><th>Doors sf</th>
          <th>Net sf</th><th>Foam</th>
          <th>R-Value</th><th>Thick (in)</th>
          <th>Board Feet</th><th>Conf.</th>
        </tr></thead>
        <tbody>`;
      areas.forEach(a => {
        const lowConf = (a.confidence || 100) < 70;
        html += `<tr${lowConf ? ' class="low-conf"' : ''}>
          <td><strong>${a.label || '—'}</strong>${lowConf ? ' <span style="color:#d97706">⚠️</span>' : ''}</td>
          <td>${typeLabel(a.type)}</td>
          <td>${fmtD(a.length_ft)}</td>
          <td>${fmtD(a.height_ft)}</td>
          <td>${fmt(a.window_area_sf)}</td>
          <td>${fmt(a.door_area_sf)}</td>
          <td><strong>${fmt(a.net_area_sf)}</strong></td>
          <td>${foamBadge(a.foam_type)}</td>
          <td>R-${a.r_value || '—'}</td>
          <td>${fmtD(a.thickness_in)}″</td>
          <td><strong>${fmt(a.board_feet)}</strong></td>
          <td>${confBadge(a.confidence)}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    });
  }

  document.getElementById('main').innerHTML = html;
}
</script>
</body>
</html>
